services:
  basket-playbook:
    build: .
    image: basket-playbook
    container_name: basket-playbook
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_PATH: /data/basket-playbook.db
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      INVITE_CODE: ${INVITE_CODE:-}
    volumes:
      - basket_data:/data
    restart: unless-stopped

volumes:
  basket_data:
